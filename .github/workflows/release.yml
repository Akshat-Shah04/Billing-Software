name: Release installer

# Push a tag like v0.2.0 to build the Windows installer and attach it to a GitHub Release:
#   git tag v0.2.0 && git push origin v0.2.0
# You can also run it by hand from the Actions tab to get the installer as a build artifact.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Run the server tests
        working-directory: server
        run: |
          npm ci
          npm test

      - name: Work out the version number
        id: version
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") { $v = "${{ github.ref_name }}".TrimStart("v") } else { $v = "0.0.0-dev" }
          "value=$v" >> $env:GITHUB_OUTPUT

      - name: Build the app and gather Node.js and the service wrapper
        shell: pwsh
        run: ./installer/build.ps1

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Compile the installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=${{ steps.version.outputs.value }}" installer\billing.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }

      - name: Create a checksum file
        shell: pwsh
        run: |
          $f = Get-ChildItem installer\output\BillingSoftware-Setup-*.exe
          $h = (Get-FileHash $f.FullName -Algorithm SHA256).Hash.ToLower()
          "$h  $($f.Name)" | Out-File -Encoding ascii "$($f.FullName).sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: BillingSoftware-Setup
          path: installer/output/*

      - name: Publish the GitHub Release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" (Get-ChildItem installer\output\* | ForEach-Object FullName) --title "Billing Software ${{ github.ref_name }}" --generate-notes
