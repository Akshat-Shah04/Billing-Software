name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json
      - name: Server - install, typecheck, test
        working-directory: server
        run: |
          npm ci
          npm run typecheck
          npm test
      - name: Client - install and build
        working-directory: client
        run: |
          npm ci
          npm run build

  # Builds the Windows installer on every pull request, so a mistake in installer\billing.iss or
  # installer\build.ps1 is caught before a release is tagged. The setup file is kept as a build artifact.
  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build the app and gather Node.js and the service wrapper
        shell: pwsh
        run: ./installer/build.ps1
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: Compile the installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=0.0.0-ci" installer\billing.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }
      - uses: actions/upload-artifact@v4
        with:
          name: BillingSoftware-Setup-ci
          path: installer/output/*
          retention-days: 7
